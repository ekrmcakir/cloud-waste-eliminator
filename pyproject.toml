[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-waste-eliminator"
version = "0.1.0"
description = "Event-Driven FinOps & Cloud Waste Eliminator (Serverless + AI)"
readme = "README.md"
authors = [{ name = "Ekrem Cakir" }]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "click>=8.1.7",
]

[project.scripts]
waste-eliminator = "src.cli:cli"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
